<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mi inventario</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/styles.css" rel="stylesheet">
</head>
<body>

  <!-- Contenedor de avisos (ui.js -> showAlert) -->
  <div id="alert-container" class="alert-stack" aria-live="polite"></div>

  <!--
    Regla de visibilidad: los elementos con data-auth="out" solo se ven SIN sesión
    y los de data-auth="in" solo CON sesión. auth-state.js los muestra/oculta.
    Empiezan ocultos (d-none) para que no parpadeen antes de que Firebase responda.
  -->
  <header class="topbar">
    <div class="container d-flex align-items-center justify-content-between py-3">
      <span class="brand">Mi inventario</span>

      <div class="d-none gap-2" data-auth="out">
        <button class="btn btn-outline-ink" data-bs-toggle="modal" data-bs-target="#signin-modal">Iniciar sesión</button>
        <button class="btn btn-ink" data-bs-toggle="modal" data-bs-target="#signup-modal">Crear cuenta</button>
      </div>

      <div class="d-none align-items-center gap-3" data-auth="in">
        <span id="user-label" class="user-label"></span>
        <button id="btn-logout" class="btn btn-outline-ink">Cerrar sesión</button>
      </div>
    </div>
  </header>

  <main class="container py-4 py-lg-5">

    <!-- ========== SIN SESIÓN ========== -->
    <section id="auth-section" class="hero d-none" data-auth="out">
      <h1>Tus productos, con sus fotos, solo para ti.</h1>
      <p>Inicia sesión para registrar, editar y consultar tu inventario. Cada cuenta ve únicamente lo que ella misma guardó.</p>
      <div class="d-flex flex-wrap gap-2">
        <button class="btn btn-ink btn-lg" data-bs-toggle="modal" data-bs-target="#signin-modal">Iniciar sesión</button>
        <button class="btn btn-outline-ink btn-lg" data-bs-toggle="modal" data-bs-target="#signup-modal">Crear cuenta</button>
      </div>
    </section>

    <!-- ========== CON SESIÓN: módulo de productos ========== -->
    <section id="products-section" class="d-none" data-auth="in">
      <div class="row g-4">

        <!-- Formulario (product-form.js) -->
        <div class="col-lg-5">
          <div class="panel">
            <h2 id="form-title" class="panel-title">Nuevo producto</h2>

            <form id="product-form" novalidate>
              <div class="mb-3">
                <label for="p-nombre" class="form-label">Nombre</label>
                <input id="p-nombre" class="form-control" type="text" maxlength="80" required>
              </div>

              <div class="mb-3">
                <label for="p-descripcion" class="form-label">Descripción</label>
                <textarea id="p-descripcion" class="form-control" rows="3" maxlength="500" required></textarea>
              </div>

              <div class="row g-3 mb-3">
                <div class="col-6">
                  <label for="p-precio" class="form-label">Precio (MXN)</label>
                  <input id="p-precio" class="form-control" type="number" min="0" step="0.01" required>
                </div>
                <div class="col-6">
                  <label for="p-existencias" class="form-label">Existencias</label>
                  <input id="p-existencias" class="form-control" type="number" min="0" step="1" required>
                </div>
              </div>

              <div class="mb-3">
                <label for="p-categoria" class="form-label">Categoría</label>
                <select id="p-categoria" class="form-select" required>
                  <option value="">Elige una categoría</option>
                  <option>Electrónica</option>
                  <option>Ropa y calzado</option>
                  <option>Hogar</option>
                  <option>Alimentos</option>
                  <option>Papelería</option>
                  <option>Otros</option>
                </select>
              </div>

              <div class="mb-3">
                <label for="p-imagenes" class="form-label">Imágenes (de 1 a 5)</label>
                <input id="p-imagenes" class="form-control" type="file" accept="image/jpeg,image/png,image/webp,image/gif" multiple>
                <div class="d-flex justify-content-between mt-2">
                  <small id="image-counter" class="text-muted">0 de 5 imágenes</small>
                </div>
                <div id="image-error" class="field-error d-none" role="alert"></div>
                <div id="image-preview" class="image-preview"></div>
              </div>

              <div class="d-flex gap-2">
                <button id="btn-save" type="submit" class="btn btn-ink">Guardar producto</button>
                <button id="btn-cancel-edit" type="button" class="btn btn-outline-ink d-none">Cancelar edición</button>
              </div>
            </form>
          </div>
        </div>

        <!-- Lista (product-list.js) -->
        <div class="col-lg-7">
          <div class="d-flex align-items-baseline justify-content-between mb-3">
            <h2 class="panel-title mb-0">Mis productos</h2>
            <small id="product-count" class="text-muted"></small>
          </div>
          <p id="list-status" class="text-muted d-none"></p>
          <div id="product-list" class="product-grid"></div>
        </div>

      </div>
    </section>
  </main>

  <!-- ========== MODAL: iniciar sesión ========== -->
  <div class="modal fade" id="signin-modal" tabindex="-1" aria-labelledby="signin-title" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h2 class="modal-title fs-5" id="signin-title">Iniciar sesión</h2>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
        </div>
        <div class="modal-body">
          <form id="signin-form">
            <div class="mb-3">
              <label for="signin-email" class="form-label">Correo</label>
              <input id="signin-email" type="email" class="form-control" autocomplete="email" required>
            </div>
            <div class="mb-3">
              <label for="signin-password" class="form-label">Contraseña</label>
              <input id="signin-password" type="password" class="form-control" autocomplete="current-password" required>
            </div>
            <button type="submit" class="btn btn-ink w-100">Entrar</button>
          </form>

          <div class="divider"><span>o continúa con</span></div>

          <div class="d-grid gap-2">
            <button id="btn-google" type="button" class="btn btn-outline-ink">Google</button>
            <button id="btn-facebook" type="button" class="btn btn-outline-ink">Facebook</button>
            <button id="btn-microsoft" type="button" class="btn btn-outline-ink">Microsoft</button>
            <button id="btn-twitter" type="button" class="btn btn-outline-ink">X (Twitter)</button>
            <button id="btn-github" type="button" class="btn btn-outline-ink">GitHub</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- ========== MODAL: crear cuenta ========== -->
  <div class="modal fade" id="signup-modal" tabindex="-1" aria-labelledby="signup-title" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h2 class="modal-title fs-5" id="signup-title">Crear cuenta</h2>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
        </div>
        <div class="modal-body">
          <form id="signup-form">
            <div class="mb-3">
              <label for="signup-email" class="form-label">Correo</label>
              <input id="signup-email" type="email" class="form-control" autocomplete="email" required>
            </div>
            <div class="mb-3">
              <label for="signup-password" class="form-label">Contraseña (mínimo 6 caracteres)</label>
              <input id="signup-password" type="password" class="form-control" autocomplete="new-password" minlength="6" required>
            </div>
            <button type="submit" class="btn btn-ink w-100">Crear cuenta</button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Único punto de entrada: main.js importa y conecta todos los módulos -->
  <script type="module" src="app/main.js"></script>
</body>
</html>
